{{- end }}

[keystore.primary]
file_name =  {{ .Values.deploymentToml.keystore.primary.fileName | quote }}
type =  {{ .Values.deploymentToml.keystore.primary.type | quote }}
{{- if .Values.deployment.secretStore.enabled }}
password = "$secret{keystore_primary_password}"
{{- else }}
