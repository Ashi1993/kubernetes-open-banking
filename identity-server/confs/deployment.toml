[[datasource]]
id="WSO2FS_DB"
url = {{ .Values.deploymentToml.database.fs_consent.url | quote }}
{{- if .Values.deployment.secretStore.enabled }}
username = "$secret{database_fs_consent_username}"
password = "$secret{database_fs_consent_password}"
{{- else }}
