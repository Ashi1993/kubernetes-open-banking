#================configs related to application-authentication.xml=============
[authentication.endpoints]
login_url = "https://{{ .Values.deployment.ingress.hostName }}/authenticationendpoint/login.do"
retry_url = "https://{{ .Values.deployment.ingress.hostName }}/authenticationendpoint/retry.do"

[authentication.endpoint.redirect_params]
filter_policy = "include"
remove_on_consume_from_api = "true"
parameters = ["sessionDataKeyConsent","relyingParty", "authenticators", "authFailureMsg", "authFailure"]

#[authentication.authenticator.sms_otp.parameters] - 293
#EnableAccountLockingForFailedAttempts = true
#BackupCode = false
#TokenExpiryTime = 60

#================configs related to identity.xml=============
[identity_data_source]
skip_db_schema_creation = true

# Block all unused fileupload with super tenant permissions (SECURITYINTERNAL-1738)
[[resource.access_control]]
context="(.*)/fileupload/service(.*)"
secure=true
http_method = "all"
permissions = ["/permission/admin/manage/identity/applicationmgt/create"]

[[resource.access_control]]
context="(.*)/fileupload(.*)"
secure=true
http_method = "all"
permissions = ["/permission/protected/manage/monitor/tenants"]

# Configing access control for the OB APIs
[[resource.access_control]]
context = "(.*)/api/fs/consent/admin/(.*)"
http_method = "all"
secure = "true"

[[resource.access_control]]
allowed_auth_handlers = ["BasicAuthentication"]
context = "(.*)/api/fs/consent/(.*)"
http_method = "all"
permissions = ["/permission/admin"]
secure = "true"

[[resource.access_control]]
context = "(.*)/fs/authenticationendpoint/(.*)"
http_method = "all"
secure = "false"

[[resource.access_control]]
allowed_auth_handlers = ["BasicAuthentication"]
context = "(.*)/api/fs/event-notifications/(.*)"
http_method = "all"
permissions = ["/permission/admin"]
secure = "true"

[[resource.access_control]]
context = "(.*)/consentmgr/(.*)"
secure="false"
http_method="GET, DELETE"

# Configing access control for SCIM2 API required for configure IS 7.x as a key manager
[[resource.access_control]]
context="(.*)/scim2/Me"
secure=true
http_method="GET"
cross_tenant=true
permissions=[]
scopes=[]

[oauth]
drop_unregistered_scopes = true
authorize_all_scopes = true

[oauth.token_cleanup]
enable = {{ .Values.deploymentToml.oauth.tokenCleanup }}

[oauth.token_generation]
include_username_in_access_token = {{ .Values.deploymentToml.oauth.tokenGeneration.includeUsernameInAccessToken }}
access_token_type = "self_contained"

[oauth.endpoints.v2]
oauth2_consent_page = "${carbon.protocol}://{{ .Values.deployment.ingress.hostName }}/fs/authenticationendpoint/oauth2_authz.do"
oidc_consent_page = "${carbon.protocol}://{{ .Values.deployment.ingress.hostName }}/fs/authenticationendpoint/oauth2_consent.do"

[oauth.response_type]
code.enable = false
device.enable = true
id_token.enable = true
id_token_token.enable = false
token.enable = true

[[oauth.custom_response_type]]
class = "org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.response.handler.FSCodeResponseTypeHandlerExtension"
name = "code"

[[oauth.custom_response_type]]
class = "org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.response.handler.FSHybridResponseTypeHandlerExtension"
name = "code id_token"

[oauth.grant_type.refresh_token]
enable = true
grant_handler = "org.wso2.financial.services.accelerator.identity.extensions.grant.type.handlers.FSRefreshGrantHandler"

[oauth.grant_type.authorization_code]
enable = true
grant_handler = "org.wso2.financial.services.accelerator.identity.extensions.grant.type.handlers.FSAuthorizationCodeGrantHandler"

[oauth.grant_type.password]
enable = true
grant_handler = "org.wso2.carbon.identity.oauth2.token.handlers.grant.PasswordGrantHandler"

[oauth.grant_type.client_credentials]
enable = true
grant_handler = "org.wso2.carbon.identity.oauth2.token.handlers.grant.ClientCredentialsGrantHandler"

[oauth.dcr]
enable_fapi_enforcement= {{ .Values.deploymentToml.oauth.dcr.fapiEnabled }}
ssa_jkws= {{ .Values.deploymentToml.oauth.dcr.ssaJwks | quote }}

[oauth.oidc]
id_token.signature_algorithm= {{ .Values.deploymentToml.oauth.oidc.id_token.signature_algorithm | quote }}
enable_claims_separation_for_access_tokens= {{ .Values.deploymentToml.oauth.oidc.claimSeparationEnabled }}
enable_hybrid_flow_app_level_validation= {{ .Values.deploymentToml.oauth.oidc.hybridFlowValidationEnabled }}

[oauth.oidc.token_endpoint]
signing_algorithms=["PS256","ES256"]
#signing_algorithms= {{ join ", " .Values.deploymentToml.oauth.oidc.tokenEPSigningAlgorithms}}

[oauth.oidc.user_info]
jwt_signature_algorithm={{ .Values.deploymentToml.oauth.oidc.userInfo.jwtSignatureAlgorithm | quote }}

[oauth.oidc.extensions]
claim_callback_handler = "org.wso2.financial.services.accelerator.identity.extensions.claims.FSDefaultOIDCClaimsCallbackHandler"
request_object_validator = "org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.request.validator.FSRequestObjectValidationExtension"

[oauth.mutualtls]
client_certificate_header = {{ .Values.deploymentToml.oauth.mutualtls.clientCertHeaderName | quote }}

[oauth.jwks_endpoint]
read_timeout = {{ .Values.deploymentToml.oauth.jwksEndpoint.readTimeout }}

[application_mgt]
enable_role_validation = true

[role_mgt]
allow_system_prefix_for_role = true

#================configs related to financial-services.xml=============
[financial_services.admin]
username = {{ .Values.deploymentToml.superAdmin.username | quote }}
{{- if .Values.deployment.secretStore.enabled }}
password = "$secret{super_admin_password}"
{{- else }}
password = {{ .Values.deploymentToml.superAdmin.password | quote }}
{{- end }}

[financial_services.extensions.endpoint]
enabled = {{ .Values.deploymentToml.financial_services.extensions.enabled }}
# allowed extensions: "pre_process_client_creation", "pre_process_consent_creation"
#allowed_extensions = [{{ join ", " .Values.deploymentToml.financial_services.extensions.allowedExtensions }}]
allowed_extensions = ["pre_process_client_creation", "pre_process_client_update", "pre_process_client_retrieval",
    "pre_process_consent_creation", "enrich_consent_creation_response", "pre_process_consent_file_upload",
    "enrich_consent_file_response", "pre_process_consent_retrieval", "validate_consent_file_retrieval",
    "pre_process_consent_revoke", "enrich_consent_search_response", "populate_consent_authorize_screen",
    "persist_authorized_consent", "validate_consent_access", "issue_refresh_token", "validate_authorization_request",
    "validate_event_subscription", "enrich_event_subscription_response", "validate_event_creation",
    "validate_event_polling", "enrich_event_polling_response", "map_accelerator_error_response"]
base_url = {{ .Values.deploymentToml.financial_services.extensions.base_url | quote }}
retry_count =  {{ .Values.deploymentToml.financial_services.extensions.retry_count }}
connect_timeout =  {{ .Values.deploymentToml.financial_services.extensions.connect_timeout }}
read_timeout = {{ .Values.deploymentToml.financial_services.extensions.read_timeout }}

[financial_services.extensions.endpoint.security]
# supported types : Basic-Auth or OAuth2
type = {{ .Values.deploymentToml.financial_services.extensions.security.type | quote }}
username = {{ .Values.deploymentToml.financial_services.extensions.security.username | quote }}
password = {{ .Values.deploymentToml.financial_services.extensions.security.password | quote }}
#token = {{ .Values.deploymentToml.financial_services.extensions.security.token | quote }}

[[financial_services.jdbc_persistence_manager]]
data_source.name= "WSO2FS_DB"
connection_verification_timeout=1

[financial_services.app_registration]
application_updater = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.application.listener.ApplicationUpdaterImpl"

[financial_services.app_registration.sca.primaryauth]
name = {{ .Values.deploymentToml.financial_services.appRegistration.sca.primaryauth.name | quote }}
display = {{ .Values.deploymentToml.financial_services.appRegistration.sca.primaryauth.displayName | quote }}

{{- if .Values.deploymentToml.financial_services.appRegistration.sca.idp.enabled }}
[financial_services.app_registration.sca.idp]
name = {{ .Values.deploymentToml.financial_services.appRegistration.sca.idp.name | quote }}
step = 2
{{- end}}

# Put the conditional auth script inside the <IAM_HOME>/repository/conf folder and config the file name below.
[financial_services.app_registration.conditional.auth.script]
filename= {{ .Values.deploymentToml.financial_services.appRegistration.sca.conditionalAuthScript | quote }}

[[financial_services.app_registration.dcr.params]]
name = "SoftwareId"
key = "software_id"
required = false
include_in_response = true

[[financial_services.app_registration.dcr.params]]
name = "Scope"
key = "scope"
required = true
include_in_response = true
allowed_values = ["accounts", "payments", "fundsconfirmations"]

[[financial_services.app_registration.dcr.params]]
name = "RedirectUris"
key = "redirect_uris"
required = true
include_in_response = true

[[financial_services.app_registration.dcr.params]]
name = "GrantTypes"
key = "grant_types"
required = true
include_in_response = true
allowed_values = ["authorization_code", "refresh_token", "client_credentials"]

[[financial_services.app_registration.dcr.params]]
name = "SoftwareStatement"
key = "software_statement"
required = true
include_in_response = true

[[financial_services.app_registration.dcr.params]]
name = "ApplicationType"
key = "application_type"
required = true
include_in_response = true
allowed_values = ["web"]

[[financial_services.app_registration.dcr.params]]
name = "TokenEndpointAuthMethod"
key = "token_endpoint_auth_method"
required = true
include_in_response = true

[[financial_services.app_registration.dcr.params]]
name = "IdTokenSignatureAlgorithm"
key = "id_token_signed_response_alg"
required = true
include_in_response = true

[[financial_services.app_registration.dcr.params]]
name = "RequestObjectSignatureAlgorithm"
key = "request_object_signing_alg"
required = true
include_in_response = true

[[financial_services.app_registration.dcr.params]]
name = "Iss"
key = "iss"
required = true
include_in_response = false

[[financial_services.app_registration.dcr.params]]
name = "Iat"
key = "iat"
required = true
include_in_response = false

[[financial_services.app_registration.dcr.params]]
name = "Exp"
key = "exp"
required = true
include_in_response = false

[[financial_services.app_registration.dcr.params]]
name = "Jti"
key = "jti"
required = true
include_in_response = false

[[financial_services.app_registration.dcr.params]]
name = "Aud"
key = "aud"
required = true
include_in_response = false

[[financial_services.app_registration.dcr.validators.validator]]
name = "RequiredParamsValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.RequiredParamsValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.requiredParamsValidatorEnabled }}
priority = 1
[[financial_services.app_registration.dcr.validators.validator]]
name = "IssuerValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.IssuerValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.issuerValidatorEnabled }}
priority = 2
[[financial_services.app_registration.dcr.validators.validator]]
name = "RedirectUriFormatValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.RedirectUriFormatValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.redirectUriFormatValidatorEnabled }}
priority = 3
[[financial_services.app_registration.dcr.validators.validator]]
name = "RedirectUriMatchValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.RedirectUriMatchValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.redirectUriMatchValidatorEnabled }}
priority = 4
[[financial_services.app_registration.dcr.validators.validator]]
name = "UriHostnameValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.UriHostnameValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.uriHostnameValidatorEnabled }}
priority = 5
[[financial_services.app_registration.dcr.validators.validator]]
name = "SSAIssuerValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.SSAIssuerValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.ssaIssuerValidatorEnabled }}
priority = 6
allowed_values = ["OpenBanking Ltd"]
[[financial_services.app_registration.dcr.validators.validator]]
name = "RequestJTIValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.RequestJTIValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.requestJTIValidatorEnabled }}
priority = 7
[[financial_services.app_registration.dcr.validators.validator]]
name = "SSAJTIValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.SSAJTIValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.ssaJTIValidatorEnabled }}
priority = 8
[[financial_services.app_registration.dcr.validators.validator]]
name = "TokenEndpointAuthSigningAlgValidator"
class = "org.wso2.financial.services.accelerator.identity.extensions.client.registration.dcr.validators.TokenEndpointAuthSigningAlgValidator"
enable = {{ .Values.deploymentToml.financial_services.appRegistration.dcr.validators.tokenEndpointAuthSigningAlgValidatorEnabled }}
priority = 9

#================consent management==============
[financial_services.consent]
# Set to true if the consent is pre-initiated by the TPP
is_pre_initiated_consent= {{ .Values.deploymentToml.financial_services.consent.preInitiatedConsent }}
# can be one of "requestObject" or "requestParam"
auth_flow_consent_id_source= {{ .Values.deploymentToml.financial_services.consent.consentIdSource | quote }}

[financial_services.consent.consent_id_extraction]
# Must be configured if "auth_flow_consent_id_source" is set to "requestObject"
json_path= {{ .Values.deploymentToml.financial_services.consent.consentIdExtract.jsonPath | quote }}
# Must be configured if "auth_flow_consent_id_source" is set to "requestParam"
key= {{ .Values.deploymentToml.financial_services.consent.consentIdExtract.key | quote }}
# Optionally configure a regex pattern to further extract the consent id from the extracted value
regex_pattern= {{ .Values.deploymentToml.financial_services.consent.consentIdExtract.regexPattern | quote }}

[financial_services.consent.manage]
handler="org.wso2.financial.services.accelerator.consent.mgt.extensions.manage.impl.DefaultConsentManageHandler"
validator="org.wso2.financial.services.accelerator.consent.mgt.extensions.manage.impl.DefaultConsentManageValidator"

[financial_services.consent.manage_extension]
allowed_headers = ["x-wso2-client-id"]
#allowed_headers = [{{ join ", " .Values.deploymentToml.financial_services.consent.consentCreation.allowedHeadersForExtension }}]

[[financial_services.consent.authorize_steps.retrieve]]
class = "org.wso2.financial.services.accelerator.consent.mgt.extensions.authorize.impl.DefaultConsentRetrievalStep"
priority = 1

[[financial_services.consent.authorize_steps.retrieve]]
class = "org.wso2.financial.services.accelerator.consent.mgt.extensions.authorize.impl.NonRegulatoryConsentStep"
priority = 2

[[financial_services.consent.authorize_steps.persist]]
class = "org.wso2.financial.services.accelerator.consent.mgt.extensions.authorize.impl.DefaultConsentPersistStep"
priority = 1

[financial_services.consent.validation]
validator="org.wso2.financial.services.accelerator.consent.mgt.extensions.validate.impl.DefaultConsentValidator"
signature.alias= {{ .Values.deploymentToml.financial_services.consent.consentValidation.signatureAlias | quote }}
jwt.payload.enabled= {{ .Values.deploymentToml.financial_services.consent.consentValidation.jwtPayloadEnabled }}

[financial_services.consent.admin]
handler="org.wso2.financial.services.accelerator.consent.mgt.extensions.admin.impl.DefaultConsentAdminHandler"

[financial_services.consent.periodical_expiration]
# This property needs to be true in order to run the consent expiration periodical updater.
enabled= {{ .Values.deploymentToml.financial_services.consent.consentExpiryJob.enable }}
# Cron value for the periodical updater. "0 0 0 * * ?" cron will describe as 00:00:00am every day
cron_value= {{ .Values.deploymentToml.financial_services.consent.consentExpiryJob.cronValue | quote }}
# This value to be update for expired consents.
expired_consent_status_value= {{ .Values.deploymentToml.financial_services.consent.consentExpiryJob.expiredConsentStatusValue | quote }}
# The current consent statuses that are eligible to be expired. (Comma separated value list)
eligible_statuses= {{ .Values.deploymentToml.financial_services.consent.consentExpiryJob.eligibleStatus | quote }}

[financial_services.consent.portal.client_credentials]
client_id= {{ .Values.deploymentToml.financial_services.consent.consentPortal.consumerKey | quote }}
{{- if .Values.deployment.secretStore.enabled }}
client_secret = "$secret{consent_portal_consumer_secret}"
{{- else }}
client_secret= {{ .Values.deploymentToml.financial_services.consent.consentPortal.consumerSecret | quote }}
{{- end }}

[financial_services.consent.portal.params]
identity_server_base_url= "https://{{ .Values.deployment.ingress.hostName }}"
application_name_param= {{ .Values.deploymentToml.financial_services.consent.consentPortal.applicationNameParam | quote }}
application_logo_uri_param= {{ .Values.deploymentToml.financial_services.consent.consentPortal.applicationLogoUriParam | quote }}

[financial_services.consent.payments]
max_instructed_amount= {{ .Values.deploymentToml.financial_services.consent.paymentMaxAmount }}

[financial_services.consent.idempotency]
enabled= {{ .Values.deploymentToml.financial_services.consent.idempotency.enable }}
allowed_time_duration= {{ .Values.deploymentToml.financial_services.consent.idempotency.allowedTimeDuration }}
header_name= {{ .Values.deploymentToml.financial_services.consent.idempotency.headerName | quote }}
allowed_for_all_apis= {{ .Values.deploymentToml.financial_services.consent.idempotency.allowedForAllAPIs }}
allowed_api_resources=["payment-consents"]
#allowed_api_resources= [{{ join ", " .Values.deploymentToml.financial_services.consent.idempotency.allowedAPIResources }}]

[financial_services.consent.preserve_consent_link]
enabled=false

[financial_services.identity]
consent_id_claim_name= {{ .Values.deploymentToml.financial_services.identity.consentIdClaimName | quote }}
append_consent_id_to_token_id_token= {{ .Values.deploymentToml.financial_services.identity.appendConsentIdToTokenIdToken }}
append_consent_id_to_authz_id_token= {{ .Values.deploymentToml.financial_services.identity.appendConsentIdToAuthIdToken }}
append_consent_id_to_access_token= {{ .Values.deploymentToml.financial_services.identity.appendConsentIdToAccessToken }}
append_consent_id_to_token_introspect_response= {{ .Values.deploymentToml.financial_services.identity.appendConsentIdToTokenIntrospectResponse }}

[financial_services.identity.authentication_webapp]
servlet_extension="org.wso2.financial.services.accelerator.consent.mgt.extensions.authservlet.impl.FSDefaultAuthServletImpl"

[financial_services.identity.extensions]
# Uncomment these to get a default implementation of identity extensions
#request_object_validator="org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.request.validator.DefaultFSRequestObjectValidator"
#response_type_handler="org.wso2.financial.services.accelerator.identity.extensions.auth.extensions.response.handler.impl.FSDefaultResponseTypeHandlerImpl"
#claim_provider="org.wso2.financial.services.accelerator.identity.extensions.claims.FSDefaultClaimProvider"
#grant_handler="org.wso2.financial.services.accelerator.identity.extensions.grant.type.handlers.FSDefaultGrantHandler"
#introspection_data_provider="org.wso2.financial.services.accelerator.identity.extensions.interceptor.FSDefaultIntrospectionDataProvider"

[financial_services.identity.token]
remove_user_store_domain_from_subject= {{ .Values.deploymentToml.financial_services.identity.token.removeUserStoreDomainFromSubject }}
remove_tenant_domain_from_subject= {{ .Values.deploymentToml.financial_services.identity.token.removeTenantDomainFromSubject }}
#
##===================for Connection pool====================
[financial_services.http_connection_pool]
max_connections = {{ .Values.deploymentToml.financial_services.httpConnectionPool.maxConnections }}
max_connections_per_route = {{ .Values.deploymentToml.financial_services.httpConnectionPool.maxConnectionsPerRoute }}

[financial_services.event.notifications]
event_notification_generator="org.wso2.financial.services.accelerator.event.notifications.service.DefaultEventNotificationGenerator"
token_issuer= {{ .Values.deploymentToml.financial_services.eventNotification.tokenIssuer | quote }}
number_of_sets_to_return= {{ .Values.deploymentToml.financial_services.eventNotification.noOfSetsToReturn }}
event_creation_handler="org.wso2.financial.services.accelerator.event.notifications.service.handler.DefaultEventCreationServiceHandler"
event_polling_handler="org.wso2.financial.services.accelerator.event.notifications.service.handler.DefaultEventPollingServiceHandler"
event_subscription_handler="org.wso2.financial.services.accelerator.event.notifications.service.handler.DefaultEventSubscriptionServiceHandler"
set_sub_claim_included= {{ .Values.deploymentToml.financial_services.eventNotification.includeSubClaim }}
set_txn_claim_included= {{ .Values.deploymentToml.financial_services.eventNotification.includeTxnClaim }}
set_toe_cliam_included= {{ .Values.deploymentToml.financial_services.eventNotification.includeToeClaim }}
require_subscription_to_poll= {{ .Values.deploymentToml.financial_services.eventNotification.requireSubscriptionToPoll }}
allow_multiple_subscription= {{ .Values.deploymentToml.financial_services.eventNotification.allowMultipleSubscriptions }}

[financial_services.event.notifications.realtime]
enable= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.enable }}
periodic_cron_expression= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.periodicCronExpression | quote }}
request_timeout= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.requestTimeout }}
maximum_retry_count= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.maximumRetryCount }}
initial_retry_waiting_time= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.initialRetryWaitingTime }}
retry_function= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.retryFunction | quote }}
circuit_breaker_open_timeout= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.circuitBreakerOpenTimeout }}
pool_size= {{ .Values.deploymentToml.financial_services.eventNotification.realtime.poolSize }}
event_notification_request_generator="org.wso2.financial.services.accelerator.event.notifications.service.realtime.service.DefaultRealtimeEventNotificationRequestGenerator"

{{- if .Values.deploymentToml.extraConfigs }}
{{ .Values.deploymentToml.extraConfigs }}
{{- end }}

[encryption]
internal_crypto_provider = "org.wso2.carbon.crypto.provider.SymmetricKeyInternalCryptoProvider"
{{- if .Values.deployment.secretStore.enabled }}
key= "$secret{symmetric_key}"
{{- else }}
key= {{ .Values.deploymentToml.encryption.key | quote }}
{{- end }}

{{- if .Values.deployment.secretStore.enabled }}
# Secure vault encryted secrets
[secrets]

# Super admin creds
super_admin_username = {{ .Values.deploymentToml.superAdmin.username | quote }}
super_admin_password = {{ .Values.deploymentToml.superAdmin.password | quote }}

# Database creds
database_identity_username = {{ .Values.deploymentToml.database.identity.username | quote }}
database_identity_password = {{ .Values.deploymentToml.database.identity.password | quote }}
database_shared_username = {{ .Values.deploymentToml.database.shared.username | quote }}
database_shared_password = {{ .Values.deploymentToml.database.shared.password | quote }}
database_user_username = {{ .Values.deploymentToml.database.user.username | quote }}
database_user_password = {{ .Values.deploymentToml.database.user.password | quote }}
database_consent_username = {{ .Values.deploymentToml.database.consent.username | quote }}
database_consent_password = {{ .Values.deploymentToml.database.consent.password | quote }}

# Keystores
keystore_tls_password = {{ .Values.deploymentToml.keystore.tls.password | quote }}
keystore_tls_key_password = {{ .Values.deploymentToml.keystore.tls.keyPassword | quote }}
keystore_primary_password = {{ .Values.deploymentToml.keystore.primary.password | quote }}
keystore_primary_key_password = {{ .Values.deploymentToml.keystore.primary.keyPassword | quote }}
keystore_internal_password = {{ .Values.deploymentToml.keystore.internal.password | quote }}
keystore_internal_key_password = {{ .Values.deploymentToml.keystore.internal.keyPassword | quote }}

# Truststore
keystore_truststore_password = {{ .Values.deploymentToml.truststore.password | quote }}

# App password
app_password = {{ .Values.deploymentToml.identity.authFramework.endpoint.appPassword | quote }}

